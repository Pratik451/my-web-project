<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#eef8fc"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#cardGrad)" stroke="#0981ae" stroke-width="3"/>
  <rect x="15" y="15" width="470" height="290" rx="12" fill="none" stroke="#cbd5e1" stroke-dasharray="6,4"/>
  
  <!-- Header with Nepal Emblem Seal -->
  <circle cx="65" cy="65" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="65" y="71" text-anchor="middle" font-size="20">🇳🇵</text>
  
  <text x="110" y="55" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">नेपाल सरकार / Government of Nepal</text>
  <text x="110" y="75" font-family="sans-serif" font-size="12" font-weight="600" fill="#0981ae">नागरिकता प्रमाणपत्र (अगाडि) / Citizenship (Front)</text>
  
  <!-- Photo Frame -->
  <rect x="360" y="45" width="95" height="120" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="407" cy="95" r="22" fill="#94a3b8"/>
  <path d="M375 155 C375 125 440 125 440 155 Z" fill="#94a3b8"/>
  <text x="407" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#64748b" font-weight="bold">PHOTO</text>
  
  <!-- Detail Lines -->
  <line x1="45" y1="120" x2="330" y2="120" stroke="#cbd5e1" stroke-width="2"/>
  <text x="45" y="112" font-family="sans-serif" font-size="11" fill="#64748b">प्रमाणपत्र नं / Certificate No: <tspan font-weight="bold" fill="#0f172a">३८-०१-७४-०५२१८</tspan></text>
  
  <line x1="45" y1="155" x2="330" y2="155" stroke="#cbd5e1" stroke-width="2"/>
  <text x="45" y="147" font-family="sans-serif" font-size="11" fill="#64748b">नाम थर / Full Name: <tspan font-weight="bold" fill="#0f172a">शेर बहादुर घर्ती मगर</tspan></text>
  
  <line x1="45" y1="190" x2="330" y2="190" stroke="#cbd5e1" stroke-width="2"/>
  <text x="45" y="182" font-family="sans-serif" font-size="11" fill="#64748b">जन्म मिति / Date of Birth: <tspan font-weight="bold" fill="#0f172a">२०४८/०५/१२</tspan></text>
  
  <line x1="45" y1="225" x2="455" y2="225" stroke="#cbd5e1" stroke-width="2"/>
  <text x="45" y="217" font-family="sans-serif" font-size="11" fill="#64748b">स्थायी ठेगाना / Permanent Address: <tspan font-weight="bold" fill="#0f172a">रुपन्देही, बुटवल उपमहानगरपालिका - ४</tspan></text>
  
  <!-- Official Seal -->
  <circle cx="407" cy="255" r="28" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="407" y="259" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#dc2626" font-weight="bold">DISTRICT ADM</text>
  <text x="407" y="270" text-anchor="middle" font-family="sans-serif" font-size="7" fill="#dc2626">RUPANDEHI</text>
  
  <text x="45" y="275" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0981ae">✓ VERIFIED CITIZENSHIP DOCUMENT</text>
</svg>
