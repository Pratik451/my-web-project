<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <defs>
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef8fc"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>
  <rect width="500" height="320" rx="16" fill="url(#backGrad)" stroke="#0981ae" stroke-width="3"/>
  <rect x="15" y="15" width="470" height="290" rx="12" fill="none" stroke="#cbd5e1" stroke-dasharray="6,4"/>
  
  <text x="35" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">नागरिकता प्रमाणपत्र (पछाडि) / Citizenship Certificate (Back)</text>
  <text x="35" y="70" font-family="sans-serif" font-size="11" fill="#64748b">पारिवारिक विवरण तथा औंठाछाप / Family Record &amp; Thumbprints</text>
  
  <!-- Detail Lines -->
  <line x1="35" y1="105" x2="465" y2="105" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="35" y="98" font-family="sans-serif" font-size="11" fill="#64748b">बाबुको नाम / Father's Name: <tspan font-weight="bold" fill="#0f172a">राम बहादुर घर्ती मगर</tspan></text>
  
  <line x1="35" y1="135" x2="465" y2="135" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="35" y="128" font-family="sans-serif" font-size="11" fill="#64748b">आमाको नाम / Mother's Name: <tspan font-weight="bold" fill="#0f172a">कौशिला घर्ती मगर</tspan></text>
  
  <line x1="35" y1="165" x2="465" y2="165" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="35" y="158" font-family="sans-serif" font-size="11" fill="#64748b">बाजेको नाम / Grandfather's Name: <tspan font-weight="bold" fill="#0f172a">हरिलाल घर्ती मगर</tspan></text>
  
  <line x1="35" y1="195" x2="465" y2="195" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="35" y="188" font-family="sans-serif" font-size="11" fill="#64748b">जारी मिति / Issued Date: <tspan font-weight="bold" fill="#0f172a">२०६६/०२/१८ (जिल्ला प्रशासन कार्यालय, रुपन्देही)</tspan></text>
  
  <!-- Thumbprints -->
  <rect x="50" y="210" width="70" height="75" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="85" y="280" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#475569" font-weight="bold">बायाँ औंठाछाप</text>
  <path d="M 70 230 Q 85 220 100 230 Q 105 245 85 255 Q 65 245 70 230" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 75 235 Q 85 228 95 235 Q 98 245 85 250" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <rect x="140" y="210" width="70" height="75" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="175" y="280" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#475569" font-weight="bold">दायाँ औंठाछाप</text>
  <path d="M 160 230 Q 175 220 190 230 Q 195 245 175 255 Q 155 245 160 230" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 165 235 Q 175 228 185 235 Q 188 245 175 250" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <!-- Officer Signature -->
  <path d="M 330 250 Q 360 220 380 250 T 420 240 T 450 255" fill="none" stroke="#1e293b" stroke-width="2"/>
  <line x1="320" y1="265" x2="460" y2="265" stroke="#94a3b8" stroke-width="1"/>
  <text x="390" y="280" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#475569" font-weight="bold">अधिकृतको दस्तखत (Signature)</text>
</svg>
