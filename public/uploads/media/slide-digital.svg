      <stop offset="50%" stop-color="#073d56"/>
      <stop offset="100%" stop-color="#052636"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#digBg)"/>

  <!-- Smartphone Mockup on Right -->
  <g transform="translate(1050, 160)">
