  <text x="140" y="450" font-family="system-ui, sans-serif" font-size="24" font-weight="500" fill="#e0f2fe">Instant QR Merchant Payments • Inter-Cooperative Fund Transfer • Biometric Security</text>

  <g transform="translate(140, 520)">
