    <rect x="90" y="125" width="60" height="60" fill="#052636"/>
    <rect x="190" y="125" width="60" height="60" fill="#052636"/>
    <rect x="90" y="225" width="60" height="60" fill="#052636"/>
    <rect x="170" y="210" width="30" height="30" fill="#f59e0b"/>
    <rect x="215" y="240" width="35" height="45" fill="#052636"/>
    
    <!-- Balance Card on Screen -->
