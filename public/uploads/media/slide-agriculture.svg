<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="agroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052636"/>
      <stop offset="60%" stop-color="#073d56"/>
      <stop offset="100%" stop-color="#052636"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#agroBg)"/>

  <!-- Rolling Hills & Farming Landscape -->
  <path d="M 0 650 Q 400 500, 850 680 T 1600 620 L 1600 900 L 0 900 Z" fill="#0981ae"/>
  <path d="M 0 720 Q 500 620, 1050 750 T 1600 700 L 1600 900 L 0 900 Z" fill="#073d56"/>

  <!-- Tractor / Agro Tech Illustration on Right -->
  <g transform="translate(1000, 360)">
    <!-- Sun / Prosperity Orb -->
    <circle cx="200" cy="40" r="100" fill="#f59e0b" opacity="0.8"/>
    
    <!-- Corn / Wheat Stalks -->
    <g fill="#fef08a" stroke="#d97706" stroke-width="2">
      <ellipse cx="60" cy="180" rx="14" ry="36" transform="rotate(-25 60 180)"/>
      <ellipse cx="100" cy="160" rx="14" ry="36" transform="rotate(20 100 160)"/>
      <ellipse cx="80" cy="120" rx="12" ry="40"/>
      <line x1="80" y1="120" x2="80" y2="280" stroke="#0cb3f0" stroke-width="6"/>
    </g>
    <!-- Agro Machinery Silhouette -->
    <rect x="220" y="160" width="160" height="100" rx="12" fill="#052636" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="240" cy="270" r="40" fill="#052636" stroke="#f59e0b" stroke-width="6"/>
    <circle cx="360" cy="270" r="30" fill="#052636" stroke="#f59e0b" stroke-width="5"/>
  </g>

  <!-- Left Content Info -->
  <text x="140" y="320" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#38bdf8">AGRICULTURE &amp; MICRO-ENTERPRISE</text>
  <text x="140" y="390" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#ffffff">कृषि, पशुपालन तथा उद्यमशीलता कर्जा</text>
  <text x="140" y="460" font-family="system-ui, sans-serif" font-size="26" font-weight="500" fill="#e0f2fe">Subsidized productive loans from 8.75% for modern agro-tools, livestock, and green farming</text>

  <g transform="translate(140, 520)">
    <rect width="320" height="60" rx="12" fill="#072f42" stroke="#38bdf8" stroke-width="2"/>
    <text x="160" y="38" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#bae6fd" text-anchor="middle">सहुलियतपूर्ण कृषि कर्जा</text>
  </g>
</svg>