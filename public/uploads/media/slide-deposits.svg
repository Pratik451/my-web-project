<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="depBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052636"/>
      <stop offset="50%" stop-color="#073d56"/>
      <stop offset="100%" stop-color="#072f42"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#depBg)"/>

  <!-- High-Yield Badge & Vault Elements -->
  <g transform="translate(950, 200)">
    <!-- Vault Door Illustration -->
    <rect x="0" y="0" width="500" height="500" rx="30" fill="#072f42" stroke="#38bdf8" stroke-width="4"/>
    <circle cx="250" cy="250" r="180" fill="#0981ae" stroke="#f59e0b" stroke-width="8"/>
    <circle cx="250" cy="250" r="120" fill="#052636" stroke="#0cb3f0" stroke-width="4"/>
    
    <!-- Combination Wheel Spokes -->
    <circle cx="250" cy="250" r="45" fill="url(#coinGrad)" stroke="#ffffff" stroke-width="4"/>
    <line x1="250" y1="130" x2="250" y2="370" stroke="#f59e0b" stroke-width="8"/>
    <line x1="130" y1="250" x2="370" y2="250" stroke="#f59e0b" stroke-width="8"/>
    
    <!-- Vault Bolted Accents -->
    <circle cx="50" cy="50" r="12" fill="#38bdf8"/>
    <circle cx="450" cy="50" r="12" fill="#38bdf8"/>
    <circle cx="50" cy="450" r="12" fill="#38bdf8"/>
    <circle cx="450" cy="450" r="12" fill="#38bdf8"/>
  </g>

  <!-- Big Interest Rate Callout -->
  <text x="140" y="320" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#bae6fd">HIGH YIELD TERM DEPOSITS</text>
  <text x="140" y="440" font-family="system-ui, sans-serif" font-size="110" font-weight="900" fill="#fbbf24">11.75%</text>
  <text x="560" y="420" font-family="system-ui, sans-serif" font-size="38" font-weight="700" fill="#ffffff">वार्षिक ब्याजदर</text>
  <text x="560" y="460" font-family="system-ui, sans-serif" font-size="22" font-weight="500" fill="#e0f2fe">Per Annum Compounded Return</text>

  <text x="140" y="530" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#f0f9ff">
    • Flexible tenure from 3 months to 5 years
  </text>
  <text x="140" y="575" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#f0f9ff">
    • Instant 90% loan facility against fixed deposit receipts
  </text>
  <text x="140" y="620" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#f0f9ff">
    • Quarterly interest payout directly to active savings account
  </text>
</svg>