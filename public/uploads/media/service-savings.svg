      <stop offset="50%" stop-color="#0981ae" />
      <stop offset="100%" stop-color="#0cb3f0" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="20" fill="url(#savGrad)" />
  <circle cx="500" cy="100" r="140" fill="#ffffff" opacity="0.06" />
